apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-writer
  template:
    metadata:
      labels:
        app: log-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date) color=$APP_COLOR writer=$(hostname)" >> /data/log.txt
                sleep 10
              done
          env:
            - name: APP_COLOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_COLOR
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hostpath-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-reader
  template:
    metadata:
      labels:
        app: log-reader
    spec:
      containers:
        - name: reader
          image: busybox:1.36
          command:
            - sh
            - -c
            - touch /data/log.txt && tail -F /data/log.txt
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /data/k8s-lab
            type: DirectoryOrCreate
