apiVersion: v1
kind: Pod
metadata:
  name: multi-app-pod
  labels:
    app: multi-app
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: backend
      image: lab-backend:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
    - name: frontend
      image: lab-frontend:1.0
      imagePullPolicy: IfNotPresent
      env:
        - name: BACKEND_HOST
          value: "127.0.0.1"
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
    - name: log-reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - touch /var/log/nginx/access.log && tail -F /var/log/nginx/access.log
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
